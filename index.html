<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Box</title>
  <style>
    :root {
      --bg: #f8e729;
      --ink: #111111;
      --panel: #ffffff;
      --soft: #f3f3f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 48px 20px;
      position: relative;
      z-index: 2;
    }

    .note {
      margin: 0;
      text-align: center;
      max-width: 520px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
    }

    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(16, 22px);
      grid-template-rows: repeat(16, 22px);
      border: 2px solid var(--ink);
      background: var(--panel);
      line-height: 0;
    }

    .pixel {
      width: 22px;
      height: 22px;
      background: #fff;
      border: 1px solid #000;
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .pixel:hover {
      background: var(--soft);
    }

    .pixel.active {
      background: #111111;
    }

    .action-button {
      background: #111111;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-transform: uppercase;
    }

    .color-picker {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .color-button {
      width: 28px;
      height: 28px;
      border: 2px solid #000;
      cursor: pointer;
      padding: 0;
      background: #000;
    }

    .color-button.active {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000;
    }

    .color-button.red { background: #ff4d4d; }
    .color-button.blue { background: #2d6cdf; }
    .color-button.green { background: #34b26a; }

    #spawn-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .spawn-box {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 1px solid #000;
      background: #111;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="note">
      If your drawing is good enough, it will be kept. If not, try again. Always think outside the box.
    </p>

    <div class="pixel-grid" id="grid" aria-label="Pixel art grid"></div>

    <button class="action-button" type="button">Submit</button>

    <div class="color-picker" aria-label="Choose box color">
      <button class="color-button red active" type="button" data-color="#ff4d4d" aria-label="Red"></button>
      <button class="color-button blue" type="button" data-color="#2d6cdf" aria-label="Blue"></button>
      <button class="color-button green" type="button" data-color="#34b26a" aria-label="Green"></button>
    </div>
  </main>

  <div id="spawn-layer" aria-hidden="true"></div>

  <script>
    const grid = document.getElementById('grid');
    const submitButton = document.querySelector('.action-button');
    const spawnLayer = document.getElementById('spawn-layer');
    const colorButtons = document.querySelectorAll('.color-button');
    const totalCells = 16 * 16;
    const acceptedImageUrl = 'https://www.wagonwheelinc.com/wp-content/uploads/2023/08/Elm-Undneath.jpg';
    const paragraph = "You thought out side the box!";

    let keepDrawing = false;
    let activeColor = '#ff4d4d';

    for (let i = 0; i < totalCells; i++) {
      const cell = document.createElement('div');
      cell.className = 'pixel';
      cell.setAttribute('title', 'Click to fill');

      cell.addEventListener('click', () => {
        const isActive = cell.classList.toggle('active');
        cell.style.background = isActive ? activeColor : '#fff';
      });

      grid.appendChild(cell);
    }

    function clearPixels() {
      document.querySelectorAll('.pixel.active').forEach((cell) => {
        cell.classList.remove('active');
        cell.style.background = '#fff';
      });
    }

    submitButton.addEventListener('click', (event) => {
      event.stopPropagation();

      if (Math.random() < 1 / 8) {
        keepDrawing = true;
        submitButton.textContent = 'Picture kept';
        document.body.style.backgroundImage = `url("${acceptedImageUrl}")`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundAttachment = 'fixed';
        return;
      }

      keepDrawing = false;
      clearPixels();
      submitButton.textContent = 'Submit';
      document.body.style.backgroundImage = 'none';
    });

    colorButtons.forEach((button) => {
      button.addEventListener('click', () => {
        activeColor = button.dataset.color;
        colorButtons.forEach((btn) => btn.classList.remove('active'));
        button.classList.add('active');
      });
    });

    document.addEventListener('click', (event) => {
      if (!keepDrawing || event.target.closest('.action-button') || event.target.closest('.color-button')) {
        return;
      }

      const box = document.createElement('div');
      box.className = 'spawn-box';
      box.style.left = `${event.clientX - 10}px`;
      box.style.top = `${event.clientY - 10}px`;
      box.style.background = activeColor;
      spawnLayer.appendChild(box);
    });
  </script>
</body>
</html>
